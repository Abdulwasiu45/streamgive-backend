services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-24-bookworm
    command: sleep infinity
    working_dir: /workspaces/streamgive-backend
    volumes:
      - ..:/workspaces/streamgive-backend:cached
    environment:
      DATABASE_URL: postgresql://streamgive:streamgive@postgres:5432/streamgive
      TEST_DATABASE_URL: postgresql://streamgive:streamgive@postgres:5432/streamgive_test
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: streamgive
      POSTGRES_PASSWORD: streamgive
      POSTGRES_DB: streamgive
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamgive']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
